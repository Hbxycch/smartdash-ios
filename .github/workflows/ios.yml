name: iOS Build

# 触发方式：
#   1) push 到 main            → 编译一次，产物在 Actions 的 Artifacts 里
#   2) 打 tag（v4.2 之类）     → 额外把 ipa 传到 Release，方便固定链接分发
#   3) 手动 Run workflow       → 想验证改动时随手编一次
on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30
    # Release 步骤要用 GITHUB_TOKEN 写 Releases；默认只读，tag 构建会 403
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          sw_vers
          echo "可用 SDK:" && xcodebuild -showsdks | grep -i iphoneos || true

      - name: 安装 XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 Xcode 工程
        run: xcodegen generate

      # 高德 SDK 只能走 CocoaPods，必须在 xcodegen 之后执行（它要 .xcodeproj 才能挂 target）
      - name: 安装高德 SDK（CocoaPods）
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods --no-document
          fi
          pod --version
          # 高德 SDK 走 a.amap.com 直链下载，偶发抽风：失败自动重试 3 次
          ok=0
          for i in 1 2 3; do
            if pod install; then ok=1; break; fi
            echo "::warning::pod install 第 $i 次失败，30s 后清缓存重试"
            rm -rf Pods Podfile.lock
            sleep 30
          done
          if [ "$ok" != "1" ]; then
            echo "::error::pod install 连续 3 次失败（多半是 a.amap.com 下载超时）"
            exit 1
          fi
          ls -d SmartDash.xcworkspace

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -workspace SmartDash.xcworkspace \
            -scheme SmartDash \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      # 编译失败时把错误逐条打成 annotation，提交检查页能直接看到是哪一行
      - name: 提取编译错误
        if: failure()
        run: |
          echo "── 编译错误摘要 ──"
          grep -E "error:" build.log | head -10 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          echo "── 错误上下文 ──"
          grep -n -A8 "error:" build.log | head -160 || true

      - name: 注入高德 Key
        env:
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
        run: |
          APP="build/Build/Products/Release-iphoneos/SmartDash.app"
          if [ -z "${AMAP_API_KEY:-}" ]; then
            echo "::warning::未配置 Secret AMAP_API_KEY，本次包内地图搜索不可用"
            exit 0
          fi
          /usr/libexec/PlistBuddy -c "Set :AMapAPIKey ${AMAP_API_KEY}" "$APP/Info.plist" \
            || /usr/libexec/PlistBuddy -c "Add :AMapAPIKey string ${AMAP_API_KEY}" "$APP/Info.plist"
          echo "已写入 AMapAPIKey（长度 ${#AMAP_API_KEY}）"

      - name: 打包 unsigned IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/SmartDash.app"
          if [ ! -d "$APP" ]; then
            echo "::error::找不到编译产物 $APP"
            ls -R build/Build/Products || true
            exit 1
          fi
          rm -rf Payload SmartDash-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload SmartDash-unsigned.ipa
          ls -lh SmartDash-unsigned.ipa
          echo "SHA256: $(shasum -a 256 SmartDash-unsigned.ipa | cut -d' ' -f1)"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SmartDash-unsigned-ipa
          path: SmartDash-unsigned.ipa
          retention-days: 30

      - name: 打 tag 时发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SmartDash-unsigned.ipa
          generate_release_notes: true
