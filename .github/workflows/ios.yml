name: iOS Build

# 触发方式：
#   1) push 到 main            → 编译一次，产物在 Actions 的 Artifacts 里
#   2) 打 tag（v4.2 之类）     → 额外把 ipa 传到 Release，方便固定链接分发
#   3) 手动 Run workflow       → 想验证改动时随手编一次
on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          sw_vers
          echo "可用 SDK:" && xcodebuild -showsdks | grep -i iphoneos || true

      - name: 安装 XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project SmartDash.xcodeproj \
            -scheme SmartDash \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 unsigned IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/SmartDash.app"
          if [ ! -d "$APP" ]; then
            echo "::error::找不到编译产物 $APP"
            ls -R build/Build/Products || true
            exit 1
          fi
          rm -rf Payload SmartDash-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload SmartDash-unsigned.ipa
          ls -lh SmartDash-unsigned.ipa
          echo "SHA256: $(shasum -a 256 SmartDash-unsigned.ipa | cut -d' ' -f1)"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SmartDash-unsigned-ipa
          path: SmartDash-unsigned.ipa
          retention-days: 30

      - name: 打 tag 时发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SmartDash-unsigned.ipa
          generate_release_notes: true
