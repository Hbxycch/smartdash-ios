# XcodeGen 工程描述文件。
# 本机不需要装 Xcode：GitHub Actions 的 macOS 机器会执行 `xcodegen generate` 生成 .xcodeproj 再编译。
# 改了源文件目录结构、Info.plist 权限、bundle id、版本号，都改这里，不要手改 .xcodeproj。
# 工程名 SmartDash（仪表台）；应用对外显示名是「智能仪表」，见 CFBundleDisplayName。
name: SmartDash

# ── SPM 依赖（与 CocoaPods 混用：Podfile 管高德，这里管车队语音 LiveKit）──
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    from: 2.15.0

options:
  bundleIdPrefix: com.smartdash
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
    SWIFT_OPTIMIZATION_LEVEL: "-Onone"      # Release 下由 configs 覆盖
    # 高德是 ObjC 静态库：-ObjC 保证 category/分类方法不被裁掉，其余是 SDK 依赖的系统库
    OTHER_LDFLAGS: "-ObjC -lz -lc++ -lsqlite3"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  SmartDash:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    dependencies:
      - package: LiveKit
        product: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartdash.monitor.ios
        PRODUCT_NAME: SmartDash
        MARKETING_VERSION: "4.23"
        CURRENT_PROJECT_VERSION: "63"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # ── 高德 SDK 桥接 ──
        SWIFT_OBJC_BRIDGING_HEADER: Support/SmartDash-Bridging-Header.h
        # 免费个人证书签名时不允许的 capability 不要声明；后台蓝牙/定位已在 Info.plist 里
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 智能仪表
        CFBundleName: SmartDash
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        # ── 强制横屏：车机屏幕物理上就是横装，只保留两个横向方向 ──
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # ── 权限说明（缺了会在首次使用时闪退）──
        NSBluetoothAlwaysUsageDescription: 需要蓝牙与电池保护板（JK-BMS / ANT-BMS）及智科控制器通信，读取电压、电流、温度、转速等实时数据。
        NSBluetoothPeripheralUsageDescription: 需要蓝牙与电池保护板通信。
        NSLocationWhenInUseUsageDescription: 用于显示车速、航向与地图导航。
        NSLocationAlwaysAndWhenInUseUsageDescription: 导航过程中需要在锁屏或切后台时继续使用定位，否则路线会中断。
        NSMicrophoneUsageDescription: 语音输入目的地需要麦克风。
        NSSpeechRecognitionUsageDescription: 把您说出的目的地转成搜索关键词，仅在本机识别。
        NSCameraUsageDescription: 扫描后台生成的授权码二维码，用于激活云端上报。
        # ── 高德 Key ──
        # 留空则地图搜索不可用（界面会提示未配置）。CI 会用仓库 Secret AMAP_API_KEY 覆盖。
        AMapAPIKey: ""
        # 允许在「文件」App 里访问 App 沙盒（日志导出后用户可自行拷贝）
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # ── 后台模式：锁屏/切后台时保持 BLE 与定位 ──
        UIBackgroundModes:
          - bluetooth-central
          - location
        ITSAppUsesNonExemptEncryption: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false

schemes:
  SmartDash:
    build:
      targets:
        SmartDash: all
    run:
      config: Debug
    archive:
      config: Release
